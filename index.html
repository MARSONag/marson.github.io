<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARSON</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    padding-top: 96px;
}

/* =========================
   HEADER
========================= */

.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 56px;

    background: #fff;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;
}

.logo {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.5px;
}

/* iMessage 风格信息按钮 */

.message-button {
    width: 23px;
    height: 23px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;
}

.message-button svg {
    width: 22px;
    height: 22px;

    stroke: #000;
    fill: none;

    stroke-width: 1.7;

    stroke-linecap: round;
    stroke-linejoin: round;
}

/* =========================
   YEAR NAVIGATION
========================= */

.year-nav {
    position: fixed;

    top: 56px;
    left: 0;

    width: 100%;
    height: 40px;

    background: #fff;

    z-index: 999;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 25px;

    font-size: 12px;
}

.year-nav span {
    cursor: pointer;
    opacity: 0.4;

    transition: opacity 0.2s ease;
}

.year-nav span.active {
    opacity: 1;
}

/* =========================
   YEAR PAGE
========================= */

.year-page {
    display: none;

    width: 100%;

    padding: 0 14px 50px;
}

.year-page.active {
    display: block;
}

/* =========================
   PRODUCT GRID
========================= */

.product-grid {

    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    column-gap: 12px;

    row-gap: 28px;
}

/* =========================
   PRODUCT
========================= */

.product {
    width: 100%;

    cursor: pointer;

    min-width: 0;
}

/* 图片 */

.product-image {

    width: 100%;

    aspect-ratio: 1 / 1;

    background: #f1f1f1;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.product-image img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.placeholder {

    font-size: 10px;

    color: #777;

    letter-spacing: 0.5px;
}

/* =========================
   PRODUCT CODE
========================= */

.product-code {

    width: 100%;

    margin-top: 9px;

    font-size: 18px;

    line-height: 1;

    text-align: center;

    letter-spacing: 0.2px;

    font-weight: 400;
}

/* =========================
   INFO OVERLAY
========================= */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(255,255,255,0.98);

    z-index: 3000;

    display: none;

    overflow-y: auto;
}

.overlay.active {
    display: block;
}

.overlay-header {

    height: 56px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;
}

.overlay-title {

    font-size: 18px;

    font-weight: 500;
}

.close {

    font-size: 28px;

    line-height: 1;

    cursor: pointer;

    font-weight: 200;
}

.info-content {

    max-width: 700px;

    margin: 0 auto;

    padding: 30px 20px 60px;
}

.info-content a {

    display: block;

    color: #000;

    text-decoration: none;

    font-size: 15px;

    padding: 16px 0;

    border-bottom: 1px solid #e8e8e8;
}

/* =========================
   PRODUCT DETAIL
========================= */

.product-detail {

    width: 100%;

    max-width: 700px;

    margin: 0 auto;

    padding: 20px 20px 60px;
}

.detail-image {

    width: 100%;

    aspect-ratio: 1 / 1;

    background: #f1f1f1;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 18px;

    overflow: hidden;
}

.detail-image img {

    width: 100%;

    height: 100%;

    object-fit: cover;
}

.detail-code {

    width: 100%;

    text-align: center;

    font-size: 22px;

    margin-bottom: 18px;
}

.detail-text {

    text-align: center;

    font-size: 12px;

    color: #666;

    letter-spacing: 0.4px;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 800px) {

    body {
        padding-top: 110px;
    }

    .header {

        height: 62px;

        padding: 0 25px;
    }

    .logo {
        font-size: 19px;
    }

    .message-button,
    .message-button svg {
        width: 24px;
        height: 24px;
    }

    .year-nav {

        top: 62px;

        height: 48px;

        gap: 38px;

        font-size: 13px;
    }

    .year-page {

        padding-left: 24px;
        padding-right: 24px;
    }

    .product-grid {

        column-gap: 18px;

        row-gap: 36px;
    }

    .product-code {

        margin-top: 10px;

        font-size: 18px;
    }
}

/* =========================
   SMALL PHONE
========================= */

@media (max-width: 360px) {

    .header {
        padding-left: 13px;
        padding-right: 13px;
    }

    .year-nav {

        gap: 14px;

        font-size: 10px;
    }

    .year-page {

        padding-left: 8px;
        padding-right: 8px;
    }

    .product-grid {

        column-gap: 8px;

        row-gap: 22px;
    }

    .product-code {

        font-size: 16px;

        margin-top: 7px;
    }
}
</style>
</head>


<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        MARSON
    </div>

    <!-- iMessage 风格气泡 -->

    <div
        class="message-button"
        onclick="openInfo()"
        aria-label="Information"
    >

        <svg
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path
                d="M20 11.5
                   C20 15.64 16.19 19 11.5 19
                   C10.43 19 9.4 18.83 8.46 18.52
                   L4 20
                   L5.08 16.48
                   C4.09 15.15 3.5 13.47 3.5 11.5
                   C3.5 7.36 7.31 4 12 4
                   C16.69 4 20 7.36 20 11.5Z"
            />

        </svg>

    </div>

</header>


<!-- =========================
     YEAR NAVIGATION
========================= -->

<nav class="year-nav">

    <span
        class="active"
        onclick="showYear(2021, this)"
    >
        2021
    </span>

    <span onclick="showYear(2022, this)">
        2022
    </span>

    <span onclick="showYear(2023, this)">
        2023
    </span>

    <span onclick="showYear(2024, this)">
        2024
    </span>

    <span onclick="showYear(2025, this)">
        2025
    </span>

    <span onclick="showYear(2026, this)">
        2026
    </span>

</nav>


<!-- =========================
     PRODUCT ARCHIVE
========================= -->

<main id="products"></main>


<!-- =========================
     INFORMATION
========================= -->

<div
    class="overlay"
    id="infoOverlay"
>

    <div class="overlay-header">

        <div class="overlay-title">
            INFORMATION
        </div>

        <div
            class="close"
            onclick="closeInfo()"
        >
            ×
        </div>

    </div>


    <div class="info-content">

        <a
            href="https://m.tb.cn/h.8ocObld?tk=K4EGT5lYo53"
            target="_blank"
        >
            闲鱼
        </a>

        <a
            href="https://www.douyin.com/"
            target="_blank"
        >
            抖音 · MARSONISTHETRUTH
        </a>

        <a
            href="https://www.instagram.com/marsonisthetruth/"
            target="_blank"
        >
            Instagram · @marsonisthetruth
        </a>

        <a
            href="https://www.threads.net/@marsonisthetruth"
            target="_blank"
        >
            Threads · @marsonisthetruth
        </a>

        <a
            href="https://www.tiktok.com/@marson_x"
            target="_blank"
        >
            TikTok · @marson_x
        </a>

        <a
            href="https://www.youtube.com/@maxx4697"
            target="_blank"
        >
            YouTube · @maxx4697
        </a>

        <a
            href="https://open.spotify.com/user/31gft5acuo77sghzdyf6swaldxvi"
            target="_blank"
        >
            Spotify
        </a>

        <a
            href="mailto:18957912998mxx@gmail.com"
        >
            18957912998mxx@gmail.com
        </a>

    </div>

</div>


<!-- =========================
     PRODUCT DETAIL
========================= -->

<div
    class="overlay"
    id="productOverlay"
>

    <div class="overlay-header">

        <div class="overlay-title">
            MARSON
        </div>

        <div
            class="close"
            onclick="closeProduct()"
        >
            ×
        </div>

    </div>


    <div class="product-detail">

        <div
            class="detail-image"
            id="detailImage"
        >

            <div class="placeholder">
                PRODUCT IMAGE
            </div>

        </div>


        <div
            class="detail-code"
            id="detailCode"
        >
            TS-01
        </div>


        <div class="detail-text">
            MARSON ARCHIVE
        </div>

    </div>

</div>


<script>

/* =========================
   PRODUCT CATEGORIES
========================= */

const categories = [

    {
        code: "TS",
        name: "短袖"
    },

    {
        code: "SH",
        name: "衬衫"
    },

    {
        code: "HD",
        name: "卫衣"
    },

    {
        code: "JK",
        name: "外套"
    },

    {
        code: "SN",
        name: "鞋"
    },

    {
        code: "AC",
        name: "配饰"
    },

    {
        code: "VT",
        name: "背心"
    },

    {
        code: "PT",
        name: "裤子"
    },

    {
        code: "NF",
        name: "非服饰"
    }

];


/* =========================
   YEARS
========================= */

const years = [

    2021,
    2022,
    2023,
    2024,
    2025,
    2026

];


/* =========================
   CREATE ALL PRODUCTS
========================= */

const productsContainer =
    document.getElementById("products");


years.forEach(
    (year, yearIndex) => {

        const page =
            document.createElement("section");

        page.className =
            "year-page" +
            (
                yearIndex === 0
                    ? " active"
                    : ""
            );

        page.id =
            "year-" + year;


        const grid =
            document.createElement("div");

        grid.className =
            "product-grid";


        /*
           每一个年份：
           9个类别
           每个类别6个产品
           总计54个
        */

        categories.forEach(
            category => {

                for (
                    let number = 1;
                    number <= 6;
                    number++
                ) {

                    const product =
                        document.createElement("div");

                    product.className =
                        "product";


                    const code =
                        category.code +
                        "-" +
                        String(number)
                            .padStart(2, "0");


                    /* 图片 */

                    const image =
                        document.createElement("div");

                    image.className =
                        "product-image";


                    const placeholder =
                        document.createElement("div");

                    placeholder.className =
                        "placeholder";

                    placeholder.innerText =
                        "PRODUCT IMAGE";


                    image.appendChild(
                        placeholder
                    );


                    /* 编号 */

                    const codeElement =
                        document.createElement("div");

                    codeElement.className =
                        "product-code";

                    codeElement.innerText =
                        code;


                    product.appendChild(image);

                    product.appendChild(
                        codeElement
                    );


                    /* 点击 */

                    product.onclick =
                        function() {

                            openProduct(
                                year,
                                code
                            );

                        };


                    grid.appendChild(
                        product
                    );

                }

            }
        );


        page.appendChild(grid);

        productsContainer.appendChild(page);

    }
);


/* =========================
   CHANGE YEAR
========================= */

function showYear(
    year,
    clickedElement
) {

    document
        .querySelectorAll(".year-page")
        .forEach(
            page => {

                page.classList.remove(
                    "active"
                );

            }
        );


    const target =
        document.getElementById(
            "year-" + year
        );


    if (target) {

        target.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(".year-nav span")
        .forEach(
            item => {

                item.classList.remove(
                    "active"
                );

            }
        );


    clickedElement.classList.add(
        "active"
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   INFORMATION
========================= */

function openInfo() {

    document
        .getElementById(
            "infoOverlay"
        )
        .classList.add(
            "active"
        );

}


function closeInfo() {

    document
        .getElementById(
            "infoOverlay"
        )
        .classList.remove(
            "active"
        );

}


/* =========================
   PRODUCT DETAIL
========================= */

function openProduct(
    year,
    code
) {

    document
        .getElementById(
            "detailCode"
        )
        .innerText =
        code;


    document
        .querySelector(
            "#productOverlay .overlay-title"
        )
        .innerText =
        year;


    document
        .getElementById(
            "productOverlay"
        )
        .classList.add(
            "active"
        );

}


function closeProduct() {

    document
        .getElementById(
            "productOverlay"
        )
        .classList.remove(
            "active"
        );

}


/* =========================
   ESC
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeInfo();

            closeProduct();

        }

    }
);

</script>

</body>
</html>
