<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARSON</title>

<style>

* {

    box-sizing: border-box;

}

html,

body {

    margin: 0;

    padding: 0;

    background: #fff;

    color: #000;

    font-family: Arial, Helvetica, sans-serif;

}

body {

    padding-top: 92px;

}

/* =========================

   HEADER

========================= */

.header {

    position: fixed;

    top: 0;

    left: 0;

    width: 100%;

    height: 52px;

    background: #fff;

    z-index: 1000;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

}

.logo {

    font-size: 18px;

    font-weight: 500;

    letter-spacing: 0.5px;

}

.info-button {

    font-size: 19px;

    cursor: pointer;

    user-select: none;

}

/* =========================

   YEAR NAVIGATION

========================= */

.year-nav {

    position: fixed;

    top: 52px;

    left: 0;

    width: 100%;

    height: 40px;

    background: #fff;

    z-index: 999;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 24px;

    font-size: 12px;

}

.year-nav span {

    cursor: pointer;

    opacity: 0.45;

}

.year-nav span.active {

    opacity: 1;

}

/* =========================

   YEAR PAGE

========================= */

.year-page {

    display: none;

    padding: 0 14px 30px 14px;

}

.year-page.active {

    display: block;

}

/* =========================

   PRODUCT GRID

========================= */

.product-grid {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    column-gap: 12px;

    row-gap: 24px;

    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

}

/* =========================

   PRODUCT

========================= */

.product {

    cursor: pointer;

    min-width: 0;

}

.product-image {

    width: 100%;

    aspect-ratio: 1 / 1;

    background: #f3f3f3;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}

.product-image img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

}

.placeholder {

    font-size: 10px;

    color: #777;

    letter-spacing: 0.5px;

}

/* 产品编号 */

.product-code {

    margin-top: 5px;

    font-size: 11px;

    line-height: 1;

    text-align: left;

    letter-spacing: 0.3px;

}

/* =========================

   INFO PANEL

========================= */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(255,255,255,0.97);

    z-index: 2000;

    display: none;

    overflow-y: auto;

}

.overlay.active {

    display: block;

}

.overlay-header {

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 18px;

}

.overlay-title {

    font-size: 18px;

}

.close {

    font-size: 20px;

    cursor: pointer;

}

.info-content {

    padding: 35px 20px;

    max-width: 700px;

    margin: 0 auto;

}

.info-content a {

    display: block;

    color: #000;

    text-decoration: none;

    font-size: 14px;

    padding: 12px 0;

    border-bottom: 1px solid #eee;

}

/* =========================

   PRODUCT DETAIL

========================= */

.product-detail {

    max-width: 700px;

    margin: 0 auto;

    padding: 25px 20px 60px;

}

.detail-image {

    width: 100%;

    aspect-ratio: 1 / 1;

    background: #f3f3f3;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 18px;

}

.detail-image img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}

.detail-code {

    font-size: 14px;

    margin-bottom: 15px;

}

.detail-text {

    font-size: 12px;

    line-height: 1.7;

    color: #555;

}

/* =========================

   DESKTOP

========================= */

@media (min-width: 800px) {

    body {

        padding-top: 105px;

    }

    .header {

        height: 60px;

        padding: 0 24px;

    }

    .year-nav {

        top: 60px;

        height: 45px;

        gap: 35px;

        font-size: 12px;

    }

    .year-page {

        padding-left: 24px;

        padding-right: 24px;

    }

    .product-grid {

        column-gap: 18px;

        row-gap: 30px;

    }

    .product-code {

        font-size: 12px;

        margin-top: 7px;

    }

}

/* =========================

   VERY SMALL PHONES

========================= */

@media (max-width: 360px) {

    .year-nav {

        gap: 13px;

        font-size: 10px;

    }

    .year-page {

        padding-left: 9px;

        padding-right: 9px;

    }

    .product-grid {

        column-gap: 8px;

        row-gap: 18px;

    }

    .product-code {

        font-size: 10px;

    }

}

</style>

</head>

<body>

<!-- =========================

     HEADER

========================= -->

<header class="header">

    <div class="logo">

        MARSON

    </div>

    <div class="info-button" onclick="openInfo()">

        ⓘ

    </div>

</header>

<!-- =========================

     YEAR NAV

========================= -->

<nav class="year-nav">

    <span class="active" onclick="showYear(2021)">2021</span>

    <span onclick="showYear(2022)">2022</span>

    <span onclick="showYear(2023)">2023</span>

    <span onclick="showYear(2024)">2024</span>

    <span onclick="showYear(2025)">2025</span>

    <span onclick="showYear(2026)">2026</span>

</nav>

<!-- =========================

     PRODUCTS

========================= -->

<main id="products"></main>

<!-- =========================

     INFO OVERLAY

========================= -->

<div class="overlay" id="infoOverlay">

    <div class="overlay-header">

        <div class="overlay-title">

            INFORMATION

        </div>

        <div class="close" onclick="closeInfo()">

            ×

        </div>

    </div>

    <div class="info-content">

        <a href="https://m.tb.cn/h.8ocObld?tk=K4EGT5lYo53" target="_blank">

            闲鱼

        </a>

        <a href="https://www.douyin.com/" target="_blank">

            抖音 · MARSONISTHETRUTH

        </a>

        <a href="https://www.instagram.com/marsonisthetruth/" target="_blank">

            Instagram · @marsonisthetruth

        </a>

        <a href="https://www.threads.net/@marsonisthetruth" target="_blank">

            Threads · @marsonisthetruth

        </a>

        <a href="https://www.tiktok.com/@marson_x" target="_blank">

            TikTok · @marson_x

        </a>

        <a href="https://www.youtube.com/@maxx4697" target="_blank">

            YouTube · @maxx4697

        </a>

        <a href="https://open.spotify.com/user/31gft5acuo77sghzdyf6swaldxvi" target="_blank">

            Spotify

        </a>

        <a href="mailto:18957912998mxx@gmail.com">

            18957912998mxx@gmail.com

        </a>

    </div>

</div>

<!-- =========================

     PRODUCT DETAIL OVERLAY

========================= -->

<div class="overlay" id="productOverlay">

    <div class="overlay-header">

        <div class="overlay-title" id="detailTitle">

            PRODUCT

        </div>

        <div class="close" onclick="closeProduct()">

            ×

        </div>

    </div>

    <div class="product-detail">

        <div class="detail-image" id="detailImage">

            <div class="placeholder">

                PRODUCT IMAGE

            </div>

        </div>

        <div class="detail-code" id="detailCode">

            TS-01

        </div>

        <div class="detail-text">

            MARSON ARCHIVE

        </div>

    </div>

</div>

<script>

/* =========================

   PRODUCT CATEGORIES

========================= */

const categories = [

    "TS",

    "PT",

    "LS",

    "HD",

    "JK",

    "SH"

];

/* =========================

   YEARS

========================= */

const years = [

    2021,

    2022,

    2023,

    2024,

    2025,

    2026

];

/* =========================

   CREATE YEAR PAGES

========================= */

const productsContainer =

    document.getElementById("products");

years.forEach((year, yearIndex) => {

    const page =

        document.createElement("section");

    page.className =

        "year-page" +

        (yearIndex === 0 ? " active" : "");

    page.id =

        "year-" + year;

    const grid =

        document.createElement("div");

    grid.className =

        "product-grid";

    /*

       每个页面12个位置

       3列 × 4行

    */

    let productCount = 0;

    categories.forEach(category => {

        for (let number = 1; number <= 9; number++) {

            /*

               每年只显示12个产品位置

            */

            if (productCount >= 12) {

                break;

            }

            productCount++;

            const product =

                document.createElement("div");

            product.className =

                "product";

            const code =

                category +

                "-" +

                String(number).padStart(2, "0");

            /*

               产品图片

               以后可以把这里换成你的图片地址

            */

            const image =

                document.createElement("div");

            image.className =

                "product-image";

            const placeholder =

                document.createElement("div");

            placeholder.className =

                "placeholder";

            placeholder.innerText =

                "PRODUCT IMAGE";

            image.appendChild(

                placeholder

            );

            /*

               产品编号

            */

            const codeElement =

                document.createElement("div");

            codeElement.className =

                "product-code";

            codeElement.innerText =

                code;

            product.appendChild(image);

            product.appendChild(

                codeElement

            );

            /*

               点击产品

            */

            product.onclick = function() {

                openProduct(

                    year,

                    code

                );

            };

            grid.appendChild(product);

        }

    });

    page.appendChild(grid);

    productsContainer.appendChild(page);

});

/* =========================

   CHANGE YEAR

========================= */

function showYear(year) {

    document

        .querySelectorAll(".year-page")

        .forEach(page => {

            page.classList.remove(

                "active"

            );

        });

    document

        .getElementById(

            "year-" + year

        )

        .classList.add("active");

    document

        .querySelectorAll(".year-nav span")

        .forEach(item => {

            item.classList.remove(

                "active"

            );

        });

    event.target.classList.add(

        "active"

    );

}

/* =========================

   INFO

========================= */

function openInfo() {

    document

        .getElementById(

            "infoOverlay"

        )

        .classList.add("active");

}

function closeInfo() {

    document

        .getElementById(

            "infoOverlay"

        )

        .classList.remove("active");

}

/* =========================

   PRODUCT DETAIL

========================= */

function openProduct(

    year,

    code

) {

    document

        .getElementById(

            "detailTitle"

        )

        .innerText =

        year;

    document

        .getElementById(

            "detailCode"

        )

        .innerText =

        code;

    document

        .getElementById(

            "productOverlay"

        )

        .classList.add("active");

}

function closeProduct() {

    document

        .getElementById(

            "productOverlay"

        )

        .classList.remove("active");

}

/* =========================

   ESC KEY

========================= */

document.addEventListener(

    "keydown",

    function(e) {

        if (e.key === "Escape") {

            closeInfo();

            closeProduct();

        }

    }

);

</script>

</body>

</html>
